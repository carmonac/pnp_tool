name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze workspace
        run: dart analyze --fatal-infos
      - name: Test pnp_core
        run: dart test
        working-directory: packages/pnp_core
      - name: Analyze app
        run: flutter analyze
        working-directory: app
      - name: Test app
        run: flutter test
        working-directory: app
