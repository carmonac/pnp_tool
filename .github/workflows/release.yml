name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cli_name: pnp_tool_linux
            bundle_name: pnp_studio_linux
          - os: windows-latest
            cli_name: pnp_tool_windows.exe
            bundle_name: pnp_studio_windows
          - os: macos-latest
            cli_name: pnp_tool_macos
            bundle_name: pnp_studio_macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Compile CLI
        run: dart compile exe packages/pnp_cli/bin/pnp_tool.dart -o ${{ matrix.cli_name }}

      - name: Build desktop app (Linux)
        if: runner.os == 'Linux'
        working-directory: app
        run: |
          flutter build linux --release
          cd build/linux/x64/release/bundle
          zip -r "$GITHUB_WORKSPACE/${{ matrix.bundle_name }}.zip" .

      - name: Build desktop app (Windows)
        if: runner.os == 'Windows'
        working-directory: app
        run: |
          flutter build windows --release
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath $env:GITHUB_WORKSPACE\${{ matrix.bundle_name }}.zip

      - name: Build desktop app (macOS)
        if: runner.os == 'macOS'
        working-directory: app
        run: |
          flutter build macos --release
          cd build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/${{ matrix.bundle_name }}.zip" pnp_studio.app

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            ${{ matrix.cli_name }}
            ${{ matrix.bundle_name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            pnp_tool_*
            pnp_studio_*.zip
          generate_release_notes: true
